name: Release
on:
    push:
        tags:
            - "*"
permissions: {}
jobs:
    release:
        permissions:
            contents: write
            id-token: write
            attestations: write
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Check tag matches
              run: |
                  TAG="$GITHUB_REF_NAME"
                  jq -e --arg tag "$TAG" '.version == $tag' package.json > /dev/null || { CURRENT_VERSION=$(jq -r '.version // "unknown"' package.json); echo "::error::package.json version is $CURRENT_VERSION but tag is $TAG."; exit 1; }
                  jq -e --arg tag "$TAG" '.version == $tag' manifest.json > /dev/null || { CURRENT_VERSION=$(jq -r '.version // "unknown"' manifest.json); echo "::error::manifest.json version is $CURRENT_VERSION but tag is $TAG."; exit 1; }
                  jq -e --arg tag "$TAG" 'has($tag)' versions.json > /dev/null || { echo "::error::versions.json does not include tag $TAG."; exit 1; }
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Format
              run: npm run format:check
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Attest build provenance
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
              with:
                  subject-path: main.js
            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="$GITHUB_REF_NAME"
                  gh release create "$tag" main.js manifest.json --title "$tag" --draft --generate-notes

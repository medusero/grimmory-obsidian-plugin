version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          safe-updates:
              update-types: ["minor", "patch"]
              patterns: ["*"]
      ignore:
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
          - dependency-name: "eslint"
            update-types: ["version-update:semver-major"]
      cooldown:
          default-days: 5
      commit-message:
          prefix: "build(deps)"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 5
      commit-message:
          prefix: "ci"
